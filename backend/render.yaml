# Backend — Render
services:
  - type: web
    name: protesefacil-backend
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3001"
      - key: EVOLUTION_API_URL
        value: http://localhost:8080
      - key: EVOLUTION_INSTANCE
        value: clinica-protese
      - key: SUPABASE_URL
        value: https://isnxixnmaxjwcnvenftz.supabase.co
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: EVOLUTION_API_KEY
        sync: false
      - key: EVOLUTION_API_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: CLINICA_NOME
        value: Vitta Prótese Dentária
      - key: CLINICA_ENDERECO
        value: Rua das Flores, 123 - Centro
      - key: CLINICA_HORARIO
        value: Seg a Sex 08h-18h, Sáb 08h-12h
