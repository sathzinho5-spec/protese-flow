services:
  evolution:
    image: atendai/evolution-api:v2.1.75
    restart: always
    ports:
      - "8080:8080"
    environment:
      - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY:-dev-evolution-key-change-me}
      - DATABASE_ENABLED=false
      - REDIS_ENABLED=false
      - RABBITMQ_ENABLED=false
      - SQS_ENABLED=false
      - WEBSOCKET_ENABLED=true
      - WEBHOOK_GLOBAL_URL=http://host.docker.internal:3001/webhook/evolution
      - WEBHOOK_GLOBAL_ENABLED=true
      - WEBHOOK_EVENTS_MESSAGES_UPSERT=true
      - CONFIG_SESSION_PHONE_CLIENT=clinica-protese
      - CONFIG_SESSION_PHONE_NAME=Chrome
      - QRCODE_LIMIT=30
    volumes:
      - ./evolution-data:/evolution/instances
    extra_hosts:
      - "host.docker.internal:host-gateway"
